# Personal academic website — GitHub Pages / Jekyll
locale: en-US
title: "Takuya Koriyama (郡山拓也)"
name: "Takuya Koriyama"
description: "Research in statistics, machine learning, and probability."
url: "https://takuyakoriyama.github.io"
baseurl: ""
repository: "TakuyaKoriyama/takuyakoriyama.github.io"
timezone: America/Los_Angeles

# Profile links used by the current layout.
author:
  name: "Takuya Koriyama"
  avatar: "profile_new.jpg"
  bio: "PhD student at UChicago"
  email: "tkoriyam@chicagobooth.edu"
  arxiv: "https://arxiv.org/search/?query=Takuya+Koriyama&searchtype=all&source=header"
  googlescholar: "https://scholar.google.com/citations?user=JOqLea0AAAAJ&hl=en"
  github: "TakuyaKoriyama"
  linkedin: "takuya-koriyama-a4ab052a1"

# Loaded only in production, unless page.analytics is false.
analytics:
  provider: "google-analytics-4"
  google:
    tracking_id: "G-EQX4K0NM3L"

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - _docs
  - cv.tex
  - vendor
  - node_modules
  - out/*.aux
  - out/*.fdb_latexmk
  - out/*.fls
  - out/*.log
  - out/*.out
  - out/*.synctex.gz
encoding: utf-8
markdown: kramdown
highlighter: rouge
future: true
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Papers are stored in _data/researcher.json; only the blog is a collection.
collections:
  research_blog:
    output: true
    permalink: /blog/:name/
defaults:
  - scope:
      path: ""
      type: research_blog
    values:
      layout: research-note
      section: note
      published: false
      math: false

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
